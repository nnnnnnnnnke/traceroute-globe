<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traceroute Globe</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- CSS 読み込み前でもサイズを持つように inline で固定 (ThreeView がコンテナサイズ 0 だと throw する) -->
    <div id="globe" style="position: fixed; inset: 0"></div>

    <aside id="control" class="panel">
      <h1>Traceroute <span>Globe</span></h1>

      <div class="tabs" role="tablist">
        <button id="tab-live" class="tab active" role="tab">実行する</button>
        <button id="tab-paste" class="tab" role="tab">貼り付け</button>
      </div>

      <form id="live-form" autocomplete="off">
        <input
          id="host"
          type="text"
          placeholder="例: one.one.one.one / 2001:4860:4860::8888"
          spellcheck="false"
          required
        />
        <div id="presets" class="presets" aria-label="行き先プリセット"></div>
        <div class="opts">
          <div class="seg" id="seg-family">
            <button type="button" data-value="4">IPv4</button>
            <button type="button" data-value="6" class="active">IPv6</button>
            <button type="button" data-value="46">両方</button>
          </div>
          <div class="seg" id="seg-proto">
            <button type="button" data-value="icmp" class="active">ICMP</button>
            <button type="button" data-value="udp">UDP</button>
          </div>
        </div>
        <button id="run" type="submit" class="primary">トレース開始</button>
      </form>

      <form id="paste-form" hidden>
        <textarea
          id="paste-text"
          rows="8"
          placeholder="traceroute / tracert / mtr --report の出力をそのまま貼り付け"
          spellcheck="false"
        ></textarea>
        <button id="visualize" type="submit" class="primary">可視化する</button>
      </form>

      <div id="status" hidden>
        <div id="status-line"></div>
        <code id="cmd-line"></code>
      </div>

      <div class="layer-row">
        <label class="layer-toggle">
          <input type="checkbox" id="cables-toggle" checked />
          海底ケーブル <small id="cables-status">読み込み中…</small>
        </label>
      </div>

      <section id="history-box" hidden>
        <header>
          <h2>履歴 <small>クリックで重ね描き</small></h2>
        </header>
        <ol id="history-list"></ol>
      </section>
    </aside>

    <aside id="hops" class="panel" hidden>
      <header>
        <h2 id="hops-title">経路</h2>
        <button id="fit" title="全体を表示">⤢ 全体</button>
      </header>
      <div id="hop-sections"></div>
    </aside>

    <aside id="asmap" class="panel" hidden>
      <header>
        <h2>AS パス</h2>
        <button id="asmap-toggle" title="折りたたむ">−</button>
      </header>
      <div id="asmap-rows"></div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
